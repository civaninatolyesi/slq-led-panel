<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLQ Yetenek Testi</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mut:#69727d;--bd:#dde1e6;--acc:#2563eb;
 --ok:#15803d;--okbg:#dcfce7;--no:#dc2626;--nobg:#fee2e2;--pa:#b45309;--pabg:#fef3c7;--sk:#6b7280}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--fg:#e6e9ee;--mut:#8b95a1;--bd:#2a3038;--acc:#60a5fa;
 --ok:#4ade80;--okbg:#12301d;--no:#f87171;--nobg:#3a1515;--pa:#fbbf24;--pabg:#3a2e0a;--sk:#9ca3af}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0}.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--bd)}
.on{background:#16a34a;color:#fff;border-color:#16a34a}
.bar{flex:1;min-width:120px;height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}#list{max-height:240px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
#list{max-height:calc(100vh - 110px);overflow:auto;padding:6px}
.it{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.it:hover{background:var(--bg)}.it.cur{background:color-mix(in srgb,var(--acc) 15%,transparent);font-weight:600}
.it .s{width:18px;flex:none;text-align:center}.it small{display:block;color:var(--mut);font-weight:400}
#num{color:var(--mut);font-size:13px}#title{font-size:22px;margin:2px 0 10px}
.exp{background:var(--bg);border-left:4px solid var(--acc);padding:10px 12px;border-radius:6px;font-size:17px}
#phase{margin:12px 0;font-weight:600}#phase.wait{color:var(--ok)}#phase.busy{color:var(--pa)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.b-ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.b-no{background:var(--nobg);color:var(--no);border-color:var(--no)}
.b-pa{background:var(--pabg);color:var(--pa);border-color:var(--pa)}
textarea{width:100%;min-height:60px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);margin-top:12px}
textarea.need{border-color:var(--pa);border-width:2px}
.io{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}@media(max-width:700px){.io{grid-template-columns:1fr}}
.io h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:0 0 4px}
pre{margin:0;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);padding:8px;border-radius:8px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#msg{color:var(--pa);margin-top:8px;font-size:14px}
</style></head><body>
<header><h1>SLQ Yetenek Testi</h1><span id="conn" class="pill">bağlanıyor…</span>
<div class="bar"><i id="prog" style="width:0"></i></div><span id="cnt" style="color:var(--mut);font-size:13px"></span></header>
<main>
<div class="card" id="list"></div>
<div class="card">
 <div id="num"></div><div id="title">—</div>
 <div class="exp"><b>Panelde ne görmelisin:</b><br><span id="expect"></span></div>
 <div id="phase"></div><div id="msg"></div>
 <textarea id="note" placeholder="Not (isteğe bağlı) — ne gördüğünü kısaca yaz"></textarea>
 <div class="btns">
  <button class="b-ok" onclick="ans('ok')">✅ Oldu</button>
  <button class="b-no" onclick="ans('fail')">❌ Olmadı</button>
  <button class="b-pa" onclick="ans('partial')">🟡 Kısmen / farklı</button>
  <button onclick="ans('retry')">🔁 Tekrar gönder</button>
  <button onclick="ans('skip')">⏭ Atla</button>
 </div>
 <div class="io"><div><h3>Gönderilen</h3><pre id="sent"></pre></div><div><h3>Panelin cevabı</h3><pre id="recv"></pre></div></div>
</div>
</main>
<script>
const IC={ok:"✅",fail:"❌",partial:"🟡",skip:"⏭",running:"▶",""
:"·"};let st=null,lastCur=null;
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function render(){if(!st)return;
 const c=document.getElementById("conn");c.className="pill"+(st.connected?" on":"");c.textContent=st.connected?"panele bağlı":"bağlanıyor…";
 const done=st.tests.filter(t=>["ok","fail","partial","skip"].includes(t.status)).length;
 document.getElementById("prog").style.width=(100*done/st.tests.length)+"%";
 document.getElementById("cnt").textContent=`${done}/${st.tests.length}`;
 document.getElementById("list").innerHTML=st.tests.map((t,i)=>`<div class="it ${i==st.cur?"cur":""}" onclick="go(${i})"><span class=s>${IC[t.status]||"·"}</span><span>${esc(t.title)}${t.note?`<small>${esc(t.note)}</small>`:""}</span></div>`).join("");
 const t=st.tests[st.cur];const wait=st.phase=="cevap bekleniyor";
 document.getElementById("num").textContent=t?`Test ${st.cur+1} / ${st.tests.length}`:"";
 document.getElementById("title").textContent=t?t.title:(st.phase=="bitti"?"Tüm testler bitti 🎉":"—");
 document.getElementById("expect").textContent=t?t.expect:"";
 const ph=document.getElementById("phase");ph.className=wait?"wait":"busy";
 ph.textContent=wait?"Panele bak ve cevap ver 👇":(st.phase=="bitti"?"":"⏳ "+st.phase+"…");
 document.getElementById("msg").textContent=st.msg||"";
 document.querySelectorAll(".btns button").forEach(b=>b.disabled=!wait);
 document.getElementById("note").className=t&&t.describe?"need":"";
 if(st.cur!==lastCur){lastCur=st.cur;document.getElementById("note").value=""}
 document.getElementById("sent").textContent=st.sent.join("\n");
 document.getElementById("recv").textContent=st.recv.join("\n")||"(cevap yok)";
 const cur=document.querySelector(".it.cur");if(cur)cur.scrollIntoView({block:"nearest"});}
async function poll(){try{st=await (await fetch("state")).json();render()}catch(e){}setTimeout(poll,700)}
async function post(o){await fetch("answer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)})}
function ans(a){const n=document.getElementById("note").value.trim();post({action:a,note:n});document.getElementById("note").value=""}
function go(i){if(st&&st.phase=="cevap bekleniyor"&&i!=st.cur)post({action:"goto",index:i})}
document.addEventListener("keydown",e=>{if(e.target.tagName=="TEXTAREA")return;
 if(e.key=="1")ans("ok");if(e.key=="2")ans("fail");if(e.key=="3")ans("partial");if(e.key=="r")ans("retry")});
poll();
</script></body></html>
